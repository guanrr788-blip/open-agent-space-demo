function overviewHTML(a){let creation=a.status==='creating';let progress=creation?'<div class="card"><h3 class="section-title">'+I('loader')+'正在创建智能体</h3>'+progressHTML(a.progress||0)+'</div>':'';const recent=a.sessions.slice(-3).reverse();return progress+'<div class="grid-overview"><div class="stack"><section class="card"><div class="card-header"><h3 class="section-title">基本信息</h3><button class="link-btn" onclick="changeTab(\'config\')">编辑配置</button></div><dl class="kv-grid">'+kv('智能体名称',E(a.name))+kv('模板',pill(a.template))+kv('当前模型',E(a.model))+kv('生效配置',pill('v'+a.version,'blue'))+kv('描述',E(a.description||'暂无描述'),true)+kv('角色设定','<span style="color:#8c99af">'+E(a.prompt).slice(0,120)+'</span>',true)+'</dl></section><section class="card"><div class="card-header"><h3 class="section-title">已关联能力 <span class="muted tiny">'+a.skills.length+'</span></h3><button class="link-btn" onclick="changeTab(\'config\')">管理能力</button></div>'+a.skills.map(id=>{let sk=skill(id);if(!sk)return'';let p=sk.auth&&!a.authorized.includes(id);return'<div class="line-item"><span class="small-icon">'+I(sk.icon)+'</span><div class="item-body"><strong>'+E(sk.name)+'</strong><p>'+E(sk.desc)+'</p></div>'+(p?'<button class="link-btn" onclick="authorizeSkill(\''+id+'\',\'agent\')">去授权</button>':pill('可用','green'))+'</div>'}).join('')+((a.knowledge||a.memory)?'<div class="line-item"><span class="small-icon">'+I('database')+'</span><div class="item-body"><strong>知识与记忆</strong><p>'+E([DB.knowledge.find(k=>k.id===a.knowledge)?.name,DB.memory.find(m=>m.id===a.memory)?.name].filter(Boolean).join(' · '))+'</p></div></div>':'')+'</section><section class="card"><div class="card-header"><h3 class="section-title">最近会话</h3><button class="link-btn" onclick="changeTab(\'sessions\')">查看全部</button></div>'+(recent.length?recent.map(s=>'<div class="line-item"><span class="small-icon">'+I('message-square')+'</span><div class="item-body"><strong>'+E(s.title)+'</strong><p>'+E(s.updated)+' · 配置 v'+s.version+'</p></div><button class="link-btn" onclick="openSession(\''+s.id+'\')">查看</button></div>').join(''):'<div class="subtitle" style="padding:8px 0 14px">还没有会话记录，创建完成后可以开始第一次在线调试。</div>')+'</section></div><div class="stack"><section class="card"><div class="card-header"><h3 class="section-title">'+I('cloud')+'运行环境</h3>'+status(a)+'</div><span class="mono tiny muted">'+(a.status==='draft'?'尚未创建':E('env_'+a.id.slice(4)))+'</span><div class="env-specs"><div><strong>'+a.spec.split(' / ')[0].replace(' vCPU','')+'</strong><span>vCPU</span></div><div><strong>'+a.spec.split(' / ')[1].replace(' GiB','')+'</strong><span>GiB 内存</span></div><div><strong>20</strong><span>GiB 存储</span></div></div><div class="subtitle" style="font-size:11px;margin-bottom:18px">专属环境 · 随智能体创建<br>镜像：'+a.template.toLowerCase()+':2026.10</div>'+button('运行管理',"changeTab('runtime')",'wide','settings')+'</section><section class="card"><h3 class="section-title">待处理事项</h3>'+(a.status==='error'?'<div class="error-summary">'+I('alert-circle','sm')+' '+E(a.error)+'</div><div style="margin-top:15px">'+button('检查模型配置',"changeTab('config')",'small')+'</div>':pending(a).length?pending(a).map(id=>'<div class="line-item"><div class="item-body"><strong>'+E(skill(id).name)+'待授权</strong><p>完成身份关联后，此技能才可调用。</p></div><button class="link-btn" onclick="authorizeSkill(\''+id+'\',\'agent\')">处理</button></div>').join(''):'<div class="subtitle">'+I('check-circle','sm')+' 当前没有待处理事项。</div>')+'</section><section class="card" style="background:#fafbfe"><h3 class="section-title" style="font-size:12px">下一步</h3><p class="subtitle" style="font-size:11px;margin:0">在在线调试中发起任务，验证模型、技能和运行环境是否符合预期。</p><button class="link-btn" style="margin-top:15px" onclick="changeTab(\'debug\')">前往在线调试 '+I('arrow-right','sm')+'</button></section></div></div>'}
function progressHTML(n){return'<div class="progress-track">'+[['保存智能体配置','建立智能体记录与配置'],['准备运行环境','按模板分配专属环境'],['启动智能体','初始化模型与运行服务'],['装载技能与资源','关联已选择的能力'],['就绪检查','确认可以开始在线调试']].map(([t,d],i)=>'<div class="progress-step '+(i<n?'done':i===n?'current':'')+'"><span class="progress-circle">'+(i<n?I('check','sm'):i+1)+'</span><div>'+t+'<small>'+d+'</small></div></div>').join('')+'</div>'}
function fieldsHTML(v,context){const w=context==='wizard';const set=w?'setWizardField':'setEditorField';return'<section class="form-section"><h3 class="section-title">基础信息</h3><div class="field"><label for="agent-name">智能体名称<span class="required">*</span></label><input id="agent-name" class="input" maxlength="50" placeholder="给智能体起个容易识别的名字" value="'+E(v.name)+'" oninput="'+set+'(\'name\',this.value)"><p class="help">最多 50 个字，在当前业务空间内保持唯一。</p><div id="name-error" class="field-error"></div></div><div class="field"><label for="agent-desc">描述</label><textarea id="agent-desc" class="textarea" style="height:75px" maxlength="200" placeholder="描述这个智能体负责什么" oninput="'+set+'(\'description\',this.value)">'+E(v.description)+'</textarea></div></section><section class="form-section"><h3 class="section-title">角色与模型</h3><div class="field-row"><div class="field"><label for="agent-model">模型<span class="required">*</span></label><select class="select" id="agent-model" onchange="'+set+'(\'model\',this.value)">'+['Qwen Plus','DeepSeek V3','Qwen Max'].map(m=>'<option '+(v.model===m?'selected':'')+'>'+m+'</option>').join('')+'</select><p class="help">使用平台已接入的模型服务。</p></div></div><div class="field"><label for="agent-prompt" style="display:flex;justify-content:space-between">系统提示词<button class="link-btn" style="font-size:10px" onclick="resetPrompt(\''+context+'\')">恢复模板默认值</button></label><textarea id="agent-prompt" class="textarea" style="height:140px" oninput="'+set+'(\'prompt\',this.value)">'+E(v.prompt)+'</textarea><p class="help">定义角色、任务范围和执行边界。</p></div></section>'+(w?'<section class="form-section"><h3 class="section-title">运行环境</h3><p class="section-sub">平台将随智能体自动准备运行环境，无需提前创建。</p><div class="field-row"><div class="field"><label>运行规格</label><select class="select" onchange="setWizardField(\'spec\',this.value)">'+['4 vCPU / 8 GiB'].map(m=>'<option '+(v.spec===m?'selected':'')+'>'+m+'</option>').join('')+'</select></div><div class="field"><label>存储空间</label><div class="input" style="background:#fafbfe;color:#93a0b7">20 GiB · 持久化存储</div></div></div><div class="advanced"><button class="disclosure" onclick="toggleAdvanced()">'+I('chevron-down','sm')+'高级设置</button><div id="advanced-content" hidden class="advanced-content"><div class="field"><label>环境变量（可选）</label><textarea class="textarea" style="height:65px" placeholder="KEY=value，每行一项。请勿填写真实密钥。" oninput="setWizardField(\'envVars\',this.value)">'+E(v.envVars||'')+'</textarea><p class="help">参数，仅用于预览配置。</p></div></div></div></section>':'')}
function toggleAdvanced(){let d=$('advanced-content');d.hidden=!d.hidden}
function setEditorField(k,v){S.editor[k]=v}
function setWizardField(k,v){S.wizard.data[k]=v;updateSummary()}
function resetPrompt(context){const v=context==='wizard'?S.wizard.data:S.editor;v.prompt=templates[v.template].prompt;if($('agent-prompt'))$('agent-prompt').value=v.prompt;toast('已恢复模板默认提示词')}
function configHTML(a){if(!S.editor)S.editor=cfg(a.draft||a);const v=S.editor;return'<div class="form-layout"><div>'+fieldsHTML(v,'editor')+'<section class="form-section"><div class="card-header"><h3 class="section-title">技能与工具</h3>'+button('添加技能',"openSkillDrawer('editor')",'small','plus',a.archived)+'</div><p class="section-sub">配置本智能体可以使用的能力。通信和设备操作需关联相应身份。</p><div id="selected-skills">'+selectedSkillsHTML(v,'editor')+'</div></section>'+associationHTML(v,'editor')+'<div class="form-footer"><span>当前生效配置 v'+a.version+'</span><div class="actions">'+button('保存草稿','saveEditor()','','save',a.archived||['creating','updating','starting','stopping'].includes(a.status))+button('应用配置','applyEditor()','primary','check',a.archived||['creating','updating','starting','stopping'].includes(a.status))+'</div></div></div>'+summaryHTML(v,false)+'</div>'}
function selectedSkillsHTML(v,context){return v.skills.length?v.skills.map(id=>{const sk=skill(id);if(!sk)return'';const p=sk.auth&&!v.authorized.includes(id);return'<div class="line-item"><span class="small-icon">'+I(sk.icon)+'</span><div class="item-body"><strong>'+E(sk.name)+'</strong><p>v'+sk.version+' · '+E(sk.category)+(p?' · 需要'+E(sk.dependency):'')+'</p></div>'+(p?'<button class="link-btn" onclick="authorizeSkill(\''+id+'\',\''+context+'\')">去授权</button>':pill('可用','green'))+'<button class="close" style="margin-left:10px" aria-label="移除'+sk.name+'" onclick="removeSelectedSkill(\''+id+'\',\''+context+'\')">'+I('x','sm')+'</button></div>'}).join(''):'<p class="subtitle">尚未选择扩展技能，可以先使用模板基础能力。</p>'}
function associationHTML(v,context){const set=context==='wizard'?'setWizardField':'setEditorField';return'<section class="form-section"><h3 class="section-title">知识、记忆与身份</h3><p class="section-sub">按需关联已有资源，不影响基础创建流程。</p><div class="field-row"><div class="field"><label>知识库</label><select class="select" onchange="'+set+'(\'knowledge\',this.value)"><option value="">暂不关联</option>'+DB.knowledge.map(k=>'<option value="'+k.id+'" '+(v.knowledge===k.id?'selected':'')+'>'+E(k.name)+'</option>').join('')+'</select></div><div class="field"><label>记忆库</label><select class="select" onchange="'+set+'(\'memory\',this.value)"><option value="">暂不关联</option>'+DB.memory.map(k=>'<option value="'+k.id+'" '+(v.memory===k.id?'selected':'')+'>'+E(k.name)+'</option>').join('')+'</select></div></div><div class="field"><label>智能体身份</label><div class="line-item" style="padding:3px 0 0;border:0"><span class="small-icon">'+I('shield')+'</span><div class="item-body"><strong>平台智能体身份</strong><p>创建时自动分配，用于关联资源与授权。</p></div>'+pill('自动分配','blue')+'</div></div></section>'}
function summaryHTML(v,wizard=true){let p=pending(v);return'<aside class="summary" id="config-summary"><h3>'+ (wizard?'配置预览':'当前配置')+'</h3><dl>'+kv('智能体名称',E(v.name||'尚未填写'))+kv('模板',pill(v.template))+kv('模型',E(v.model))+kv('运行规格',E(v.spec))+kv('扩展技能',v.skills.length+' 个'+(p.length?' <span style="color:#b28d4f">· '+p.length+' 个待授权</span>':''))+(v.knowledge?kv('知识库',E(DB.knowledge.find(k=>k.id===v.knowledge)?.name)):'')+(v.memory?kv('记忆库',E(DB.memory.find(k=>k.id===v.memory)?.name)):'')+'</dl><div class="divider"></div><div class="summary-note">'+I('info','sm')+' '+(wizard?'选择模板后，平台会自动准备对应的运行环境。可选技能待授权时，可以先完成创建。':'配置保存后需应用才会生效。修改模型与技能可能需要重启运行服务。')+'</div></aside>'}
function updateSummary(){let el=$('config-summary');if(el&&S.wizard)el.outerHTML=summaryHTML(S.wizard.data)}
function editorChanged(){if(!S.editor||!agent())return false;let base=agent().draft||agent();return ['name','description','prompt','model','knowledge','memory','spec','skills','authorized'].some(k=>JSON.stringify(S.editor[k])!==JSON.stringify(base[k]))}
function validName(v,exclude){if(!v.name.trim())return'请输入智能体名称';if(DB.agents.some(a=>a.id!==exclude&&!a.archived&&a.name===v.name.trim()))return'这个名称已存在，请换一个名称';return''}
function showNameError(msg){if($('name-error')){$('name-error').textContent=msg;$('agent-name')?.classList.add('invalid');$('agent-name')?.focus()}else toast(msg,true)}
function saveEditor(show=true){let a=agent(),msg=validName(S.editor,a.id);if(msg){showNameError(msg);return false}S.editor.name=S.editor.name.trim();a.draft=cfg(S.editor);event(a,'保存配置草稿','修改尚未应用，当前配置仍为 v'+a.version);if(show){toast('草稿已保存，应用后生效');render()}return true}
function applyEditor(){let a=agent(),msg=validName(S.editor,a.id);if(msg){showNameError(msg);return}if(a.status==='creating'||a.status==='updating'){toast('请等待当前操作完成',true);return}if(S.run?.agentId===a.id){toast('请先停止正在执行的任务，再应用配置',true);return}if(!editorChanged()&&!a.draft&&a.status!=='error'){toast('当前配置没有修改');return}const v=cfg(S.editor);confirmModal('应用新的智能体配置？','模型、角色与技能将按当前配置更新。'+(a.status==='running'?'运行服务会短暂重启，请在完成后新建会话验证。':'已停止的智能体会保持停止，启动后使用新配置。'),()=>{let old=cfg(a),wasRunning=a.status==='running';a.history=a.history||[];a.history.unshift({version:a.version,time:now(),config:old});Object.assign(a,v,{version:a.version+1,status:wasRunning?'updating':a.status==='error'?'stopped':a.status,draft:null});a.error=null;syncIdentity(a);S.editor=cfg(a);event(a,'应用配置 v'+a.version,'更新模型、角色与关联能力');render();if(wasRunning)setTimeout(()=>{a.status='running';event(a,'配置应用成功','运行服务已恢复');if(S.agentId===a.id){S.editor=cfg(a);render()}toast('配置 v'+a.version+' 已生效')},1800);else toast('新配置已生效，可启动后验证')},'确认应用')}
function stopAgent(id){const a=DB.agents.find(x=>x.id===id);confirmModal('停止「'+a.name+'」？','停止后无法执行新任务。配置、会话和已保存文件将保留；独立沙箱及关联资源不随之删除。'+(S.run?.agentId===id?'当前执行中的任务也会停止。':''),()=>{if(S.run?.agentId===id)stopRun();a.status='stopping';event(a,'停止运行','正在停止运行服务');render();setTimeout(()=>{a.status='stopped';event(a,'运行环境已停止','配置和会话记录保留');render();toast('智能体已停止')},1100)},'停止运行')}
function startAgent(id){const a=DB.agents.find(x=>x.id===id);if(a.archived){toast('请先恢复归档的智能体',true);return}if(a.status==='error'){openAgent(id,'config');toast('请先检查并应用模型配置',true);return}a.status='starting';event(a,'启动运行环境','正在使用当前生效配置启动');render();setTimeout(()=>{a.status='running';event(a,'启动成功','可以开始在线调试');render();toast(a.name+'已就绪')},1400)}
function restartAgent(id){const a=DB.agents.find(x=>x.id===id);confirmModal('重启运行环境？','服务会短暂中断。配置与会话记录保留，上次业务任务不会自动续跑。',()=>{if(S.run?.agentId===id)stopRun();a.status='starting';event(a,'重启运行环境','正在重新启动运行服务');render();setTimeout(()=>{a.status='running';event(a,'重启成功','运行服务已恢复');render();toast('重启完成')},1400)},'确认重启')}
function archiveAgent(id){const a=DB.agents.find(x=>x.id===id);confirmModal('归档「'+a.name+'」？','归档后将停止运行并移至已归档列表，配置与会话记录保留。独立沙箱、知识库和记忆库保持原状。',()=>{if(S.run?.agentId===id)stopRun();a.archived=true;a.status='stopped';event(a,'归档智能体','停止运行并保留配置与会话');S.agentId=null;S.archived=false;render();toast('已归档，可在列表中勾选“已归档”查看')},'确认归档')}
function restoreAgent(id){const a=DB.agents.find(x=>x.id===id);a.archived=false;a.status='stopped';event(a,'恢复智能体','恢复后保持停止，需手动启动');S.archived=false;render();toast('已恢复，可启动智能体')}
function duplicateAgent(id){let a=DB.agents.find(x=>x.id===id);S.wizard={step:2,data:{...cfg(a),id:undefined,name:a.name+'副本',authorized:[],knowledge:'',memory:''}};S.page='agents';S.agentId=null;render();toast('已复制配置，请重新确认技能授权')}
function runtimeHTML(a){if(a.status==='draft')return '<section class="card"><div class="empty">'+I('cloud')+'<h3>运行环境尚未创建</h3><p>完成智能体配置后，平台会一并准备运行环境。</p>'+button('继续配置',"resumeDraft('"+a.id+"')",'primary')+'</div></section>';const ev=a.events.length?a.events:[{time:a.updated,title:a.status==='error'?'模型连接失败':'环境状态更新',desc:a.error||'运行环境已关联，使用当前生效配置。'},{time:'2026-10-18 09:35',title:'准备运行环境',desc:'根据模板初始化运行环境与基础能力。'}];return(a.status==='error'?'<div class="alert red">'+I('alert-circle')+'<span>'+E(a.error)+'</span><button class="link-btn" onclick="changeTab(\'config\')">检查模型配置</button></div>':'')+'<div class="runtime-grid"><section class="card"><div class="card-header"><h3 class="section-title">运行环境</h3>'+status(a)+'</div><dl class="kv-grid">'+kv('环境 ID','<span class="mono">env_'+a.id.slice(4)+'</span>')+kv('资源归属','当前智能体专属')+kv('运行规格',E(a.spec))+kv('存储空间','20 GiB')+kv('镜像版本','<span class="mono">platform/'+a.template.toLowerCase()+':2026.10</span>',true)+kv('创建方式','随智能体自动创建')+kv('最近更新',E(a.updated))+'</dl><div style="display:flex;gap:10px;border-top:1px solid var(--line);padding-top:20px;margin-top:22px">'+(a.status==='stopped'?button('启动运行',"startAgent('"+a.id+"')",'primary','play',a.archived):button('停止运行',"stopAgent('"+a.id+"')",'','pause',a.status!=='running'))+button('重启',"restartAgent('"+a.id+"')",'','rotate-cw',a.status!=='running'||a.archived)+'</div></section><section class="card"><h3 class="section-title">配置与资源</h3><div class="line-item"><span class="small-icon">'+I('cpu')+'</span><div class="item-body"><strong>'+E(a.model)+'</strong><p>当前生效配置 v'+a.version+'</p></div><button class="link-btn" onclick="showVersions()">配置记录</button></div><div class="line-item"><span class="small-icon">'+I('tool')+'</span><div class="item-body"><strong>'+a.skills.length+' 个关联技能</strong><p>'+pending(a).length+' 个技能待授权</p></div><button class="link-btn" onclick="changeTab(\'config\')">管理</button></div><div class="line-item"><span class="small-icon">'+I('shield')+'</span><div class="item-body"><strong>平台智能体身份</strong><p>管理身份与资源授权</p></div><button class="link-btn" onclick="navigate(\'identity\')">查看身份</button></div><div class="alert blue" style="margin-top:20px;margin-bottom:0">'+I('info')+'<span>独立沙箱按需作为工具接入，与当前运行环境分别管理。</span></div></section></div><section class="card" style="margin-top:20px"><div class="card-header"><h3 class="section-title">运行事件</h3><span class="tiny muted">最近操作与状态变化</span></div>'+ev.map(e=>'<div class="timeline"><span class="time mono">'+E(e.time)+'</span><span class="small-icon" style="width:24px;height:24px">'+I('activity')+'</span><div><strong>'+E(e.title)+'</strong><p>'+E(e.desc)+'</p></div></div>').join('')+'</section><div class="note-line">'+I('info','sm')+'当前为交互，运行状态、规格与事件均为本地示例。</div>'}
function showVersions(){const a=agent(),list=[{version:a.version,time:a.updated,config:cfg(a)},...(a.history||[])];drawer('配置记录','查看当前生效配置与历史应用记录。',list.map((h,i)=>'<div class="help-block"><div style="display:flex;justify-content:space-between;align-items:center"><h4>配置 v'+h.version+'</h4>'+pill(i===0?'当前生效':'历史记录',i===0?'green':'gray')+'</div><p>'+E(h.time)+'<br>模型：'+E(h.config.model)+'<br>关联技能：'+h.config.skills.map(id=>E(skill(id)?.name)).join('、')+'</p></div>').join(''),'<span>历史记录不重写已有会话</span>'+button('关闭','closeLayer()'))}
function openWizard(template='OpenClaw'){S.resourceCategory='全部';S.page='agents';S.agentId=null;S.editor=null;S.wizard={step:1,data:{name:'',description:'',template,prompt:templates[template].prompt,model:'Qwen Plus',spec:'4 vCPU / 8 GiB',skills:['search','document'],authorized:[],knowledge:'',memory:'',envVars:''}};render();window.scrollTo(0,0)}
function resumeDraft(id){const a=DB.agents.find(x=>x.id===id);S.page='agents';S.agentId=null;S.wizard={step:2,data:{...cfg(a),draftId:a.id}};render()}
function selectTemplate(t){let v=S.wizard.data;if(v.template===t)return;const apply=()=>{v.template=t;v.prompt=templates[t].prompt;renderWizard()};if(v.name||v.description)confirmModal('更换智能体模板？','名称与描述会保留，角色提示词将恢复为新模板的默认内容。',apply,'更换模板');else apply()}
function wizardStep(n){if(n>S.wizard.step&&S.wizard.step===2){let msg=validName(S.wizard.data,S.wizard.data.draftId);if(msg){showNameError(msg);return}}S.wizard.step=n;render();window.scrollTo(0,0)}
function renderWizard(){const w=S.wizard,v=w.data;let body='';if(w.step===1)body='<section class="form-section"><h3 class="section-title">选择一个开始的方式</h3><p class="section-sub">选择已有模板，快速配置角色、模型和能力。</p><div class="template-grid">'+Object.entries(templates).map(([t,o])=>'<button class="template-card '+(v.template===t?'selected':'')+'" onclick="selectTemplate(\''+t+'\')"><span class="radio"></span>'+iconBox(t)+'<h3>'+t+'</h3><p>'+o.desc+'</p><div class="template-tags">'+o.tags.map(n=>'<span>'+n+'</span>').join('')+'</div><div class="subtext" style="margin-top:20px">推荐规格 4 vCPU / 8 GiB</div></button>').join('')+'</div><div class="template-desc">'+I('package','sm')+'自定义镜像与代码部署将在后续开放。</div></section>';if(w.step===2)body=fieldsHTML(v,'wizard');if(w.step===3)body='<section class="form-section"><div class="card-header"><h3 class="section-title">添加技能</h3><span class="tiny muted">已选 <span id="wizard-skill-count">'+v.skills.length+'</span> 个</span></div><p class="section-sub">选择任务需要的能力，通信与设备操作需要额外授权。</p><div class="subtabs">'+['全部','通用','通信','开发工具','设备操作','MCP 服务'].map(c=>'<button class="subtab '+(S.resourceCategory===c?'active':'')+'" onclick="S.resourceCategory=\''+c+'\';renderWizard()">'+c+'</button>').join('')+'</div><div class="skill-grid">'+DB.skills.filter(sk=>S.resourceCategory==='全部'||sk.category===S.resourceCategory).map(sk=>skillCardHTML(sk,v.skills,'wizard',v.authorized)).join('')+'</div></section>'+associationHTML(v,'wizard');if(w.step===4)body=reviewHTML(v);$('main').innerHTML=head('创建智能体','从模板开始，配置一个可以在云端运行的专属智能体。',button('取消','cancelWizard()','','x'))+'<div class="steps">'+['选择模板','配置智能体','添加能力','确认创建'].map((n,i)=>'<div class="step '+(i+1<w.step?'done':i+1===w.step?'active':'')+'"><span class="step-circle">'+(i+1<w.step?I('check','sm'):i+1)+'</span>'+n+'</div>'+(i<3?'<span class="step-line '+(i+1<w.step?'done':'')+'"></span>':'')).join('')+'</div><div class="form-layout"><div>'+body+'<div class="form-footer"><span>步骤 '+w.step+' / 4</span><div class="actions">'+(w.step>1?button('上一步','wizardStep('+(w.step-1)+')','','arrow-left'):'')+button('保存草稿','saveWizardDraft()','','save')+(w.step<4?button('下一步','wizardStep('+(w.step+1)+')','primary','arrow-right'):button('创建并启动','submitWizard()','primary','plus'))+'</div></div></div>'+summaryHTML(v)+'</div>'}
function skillCardHTML(sk,selected,context,authorized=[]){const on=selected.includes(sk.id),p=sk.auth&&!authorized.includes(sk.id);return'<label class="skill-card '+(on?'selected':'')+'"><input type="checkbox" class="check" '+(on?'checked':'')+' onchange="toggleSkill(\''+sk.id+'\',this.checked,\''+context+'\')"><span class="small-icon">'+I(sk.icon)+'</span><span class="skill-body"><h4>'+E(sk.name)+'</h4><p>'+E(sk.desc)+'</p>'+((on&&p)?'<span class="pill amber">待授权 · '+E(sk.dependency)+'</span>':'<span class="pill gray">'+E(sk.category)+' · v'+sk.version+'</span>')+'</span></label>'}
function toggleSkill(id,on,context){const v=context==='wizard'?S.wizard.data:context==='drawer'?null:S.editor;let list=context==='drawer'?S.drawerSkills:v.skills;if(on&&!list.includes(id))list.push(id);if(!on){let i=list.indexOf(id);if(i>=0)list.splice(i,1)}if(context==='wizard')renderWizard();else if(context==='drawer')renderSkillDrawer();else render()}
function reviewHTML(v){return'<section class="form-section"><h3 class="section-title">确认创建信息</h3><p class="section-sub">确认后，平台将准备运行环境并启动智能体。</p><div class="review-section"><div class="review-title">基础配置<button class="link-btn" onclick="wizardStep(2)">修改</button></div><dl class="kv-grid">'+kv('智能体名称',E(v.name))+kv('模板',pill(v.template))+kv('模型',E(v.model))+kv('运行规格',E(v.spec))+kv('描述',E(v.description||'暂无描述'),true)+'</dl></div><div class="review-section"><div class="review-title">已选能力<button class="link-btn" onclick="wizardStep(3)">修改</button></div>'+selectedSkillsHTML(v,'wizard')+'</div><div class="review-section"><div class="review-title">知识与记忆</div><dl class="kv-grid">'+kv('知识库',E(DB.knowledge.find(k=>k.id===v.knowledge)?.name||'暂不关联'))+kv('记忆库',E(DB.memory.find(m=>m.id===v.memory)?.name||'暂不关联'))+'</dl></div></section>'+(pending(v).length?'<div class="alert">'+I('info')+'<span>'+pending(v).length+' 个技能尚未授权。可以先创建智能体，授权前这些技能暂不可用。</span></div>':'')+'<div class="alert blue">'+I('info')+'<span>当前为本地交互，创建不会分配真实云资源，也不会产生费用。</span></div>'}
function cancelWizard(){confirmModal('取消创建智能体？','可以保存为草稿，稍后继续配置。',()=>saveWizardDraft(),'保存草稿',{secondary:'放弃创建',secondaryFn:()=>{S.wizard=null;S.page='agents';S.agentId=null;render()}})}
function saveWizardDraft(show=true){if(!S.wizard)return;let v=clone(S.wizard.data);v.name=v.name.trim()||'未命名'+v.template+'智能体';let msg=validName(v,v.draftId);if(msg){if(!v.draftId){v.name+=' '+Date.now().toString().slice(-4)}else{showNameError(msg);return}}let a=DB.agents.find(a=>a.id===v.draftId);if(a)Object.assign(a,v,{updated:now()});else DB.agents.unshift({...v,id:uid('agt'),version:1,status:'draft',sessions:[],events:[],archived:false,updated:now()});S.wizard=null;S.agentId=null;save();if(show){render();toast('创建草稿已保存')}}
function submitWizard(){let v=clone(S.wizard.data),msg=validName(v,v.draftId);if(msg){S.wizard.step=2;render();showNameError(msg);return}v.name=v.name.trim();let a=DB.agents.find(a=>a.id===v.draftId);if(a)Object.assign(a,v);else{a={...v,id:uid('agt'),version:1,sessions:[],events:[],archived:false};DB.agents.unshift(a)}a.status='creating';a.progress=0;a.updated=now();event(a,'开始创建智能体','正在保存配置与准备环境');S.wizard=null;S.agentId=a.id;S.tab='overview';render();toast('已提交创建，可在详情中查看进度');[1,2,3,4,5].forEach((n)=>setTimeout(()=>{a.progress=n;if(n===5){a.status='running';event(a,'智能体已就绪',pending(a).length?'部分技能仍待授权，其余能力可用于调试。':'模型与技能已准备完成。')}save();if(S.agentId===a.id&&S.tab==='overview')render();else if(!S.agentId&&S.page==='agents')render();if(n===5)toast(a.name+'已就绪')},n*800))}
function removeSelectedSkill(id,context){let v=context==='wizard'?S.wizard.data:S.editor;v.skills=v.skills.filter(k=>k!==id);if(context==='wizard')renderWizard();else renderDetail()}
function openSkillDrawer(context){S.drawerContext=context;S.drawerSkills=clone(context==='wizard'?S.wizard.data.skills:S.editor.skills);S.drawerQuery='';S.drawerCategory='全部';renderSkillDrawer()}
function renderSkillDrawer(){let arr=DB.skills.filter(k=>(!S.drawerQuery||[k.name,k.desc].join('').includes(S.drawerQuery))&&(S.drawerCategory==='全部'||k.category===S.drawerCategory));const v=S.drawerContext==='wizard'?S.wizard.data:S.editor;drawer('添加技能','为当前智能体选择需要的扩展能力。','<div class="search" style="width:100%;margin-bottom:18px">'+I('search')+'<input class="input" placeholder="搜索技能" value="'+E(S.drawerQuery||'')+'" onchange="S.drawerQuery=this.value;renderSkillDrawer()"></div><div class="subtabs">'+['全部','通用','通信','开发工具','设备操作','MCP 服务'].map(c=>'<button class="subtab '+(S.drawerCategory===c?'active':'')+'" onclick="S.drawerCategory=\''+c+'\';renderSkillDrawer()">'+c+'</button>').join('')+'</div><div class="skill-grid">'+arr.map(sk=>skillCardHTML(sk,S.drawerSkills,'drawer',v.authorized)).join('')+'</div>', '<span>已选 '+S.drawerSkills.length+' 个技能</span>'+button('确认添加','commitSkills()','primary'))}
function commitSkills(){let v=S.drawerContext==='wizard'?S.wizard.data:S.editor;v.skills=clone(S.drawerSkills);closeLayer();S.wizard?renderWizard():renderDetail();toast('已更新技能选择，请保存或应用配置')}
function authorizeSkill(id,context){let sk=skill(id);const identities=sk.category==='通信'?DB.identities.filter(i=>i.type===(id==='mail'?'邮箱身份':'通信身份')):DB.identities.filter(i=>i.type==='平台身份');modal('关联'+sk.name+'身份','<p>选择可访问的身份与资源，明确此技能的操作范围。</p><div class="field"><label>关联身份</label><select class="select" id="auth-identity" style="width:100%">'+identities.map(i=>'<option value="'+i.id+'">'+E(i.name)+'</option>').join('')+'</select></div><div class="field"><label>资源与权限</label><div class="scope-list">'+(id==='phone'?['通信号码','发起通话','查看通话结果']:id==='sms'?['通信号码','发送短信','读取状态']:id==='mail'?['邮箱','读取邮件','起草邮件']:['云手机','查看设备','执行操作']).map(t=>'<span class="tag-plain">'+t+'</span>').join('')+'</div></div><div class="alert blue" style="font-size:11px;margin-bottom:0">'+I('info')+'身份关联，不会实际授予外部账号权限。</div>',button('取消','closeLayer()')+button('关联身份',"commitAuth('"+id+"','"+context+"')",'primary'))}
function syncIdentity(a){if(a.authorized.some(id=>['phone','sms'].includes(id))){let i=DB.identities.find(i=>i.id==='identity_comms');if(i)i.status='可用'}if(a.authorized.includes('mail')){let i=DB.identities.find(i=>i.id==='identity_mail');if(i)i.status='可用'}}
function commitAuth(id,context){let v=context==='wizard'?S.wizard?.data:context==='editor'?S.editor:agent();if(!v)return;if(!v.authorized.includes(id))v.authorized.push(id);if(context==='agent'){syncIdentity(v);event(v,'关联技能身份',skill(id).name+'已关联身份');save()}closeLayer();render();toast(context==='agent'?'身份已关联，技能状态已更新':'已关联身份，保存配置后生效')}
function modal(title,body,footer){$('layer').innerHTML='<div class="overlay" onclick="if(event.target===this)closeLayer()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+E(title)+'"><div class="modal-head"><h3>'+E(title)+'</h3><button class="close" aria-label="关闭" onclick="closeLayer()">'+I('x')+'</button></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+footer+'</div></section></div>'}
function drawer(title,desc,body,footer){$('layer').innerHTML='<div class="overlay drawer-overlay" onclick="if(event.target===this)closeLayer()"><section class="drawer" role="dialog" aria-modal="true" aria-label="'+E(title)+'"><div class="drawer-head"><div><h3>'+E(title)+'</h3><p>'+E(desc)+'</p></div><button class="close" aria-label="关闭" onclick="closeLayer()">'+I('x')+'</button></div><div class="drawer-body">'+body+'</div><div class="drawer-foot">'+footer+'</div></section></div>'}
let modalConfirm=null,modalSecondary=null;
function confirmModal(title,text,fn,label='确认',opts={}){modalConfirm=fn;modalSecondary=opts.secondaryFn;modal(title,'<p>'+E(text)+'</p>',(opts.secondary?button(opts.secondary,'runModalSecondary()'):'')+button('取消','closeLayer()')+button(label,'runModalConfirm()','primary'))}

function runModalSecondary(){const f=modalSecondary;closeLayer();f?.()}

function renderQuick(){$('main').innerHTML='<section class="quick-intro"><div class="eyebrow">开始构建你的智能体</div><h1>从一个想法，开始创建</h1><p>选择模板，添加你需要的能力，在云端运行并验证你的第一个智能体。</p></section><div class="quick-flow">'+[['01','选择智能体模板','从已有模板开始，减少初始配置。'],['02','配置角色与能力','设置模型，关联技能、知识与记忆。'],['03','创建并在线调试','平台准备环境，直接发起任务验证。']].map(([i,t,d])=>'<div class="quick-flow-item"><span class="index">'+i+'</span><div><strong>'+t+'</strong><p>'+d+'</p></div></div>').join('')+'</div><div class="card-header"><h3 class="section-title">选择模板</h3><span class="tiny muted">模板与可用能力均为配置</span></div><div class="quick-template-grid">'+Object.entries(templates).map(([t,o])=>'<section class="quick-template">'+iconBox(t)+'<h3>'+t+'</h3><p>'+o.desc+'</p><div class="template-bottom"><div class="template-tags">'+o.tags.slice(0,2).map(s=>'<span>'+s+'</span>').join('')+'</div>'+button('开始创建',"openWizard('"+t+"')",'primary small','arrow-right')+'</div></section>').join('')+'</div><section class="quick-recent"><h3>最近使用的智能体</h3><div class="quick-links">'+DB.agents.filter(a=>!a.archived).slice(0,3).map(a=>'<button class="quick-link" onclick="openAgent(\''+a.id+'\')">'+I('cpu','sm')+E(a.name)+I('arrow-up-right','sm')+'</button>').join('')+'</div></section><div class="note-line" style="margin-top:35px">'+I('info','sm')+'运行环境随智能体统一创建；沙箱、技能、知识库、记忆库和身份可在对应模块管理。</div>'}
function ensureSession(){let a=agent();if(!a)return;if(!a.sessions.find(s=>s.id===S.sessionId)){let existing=a.sessions[a.sessions.length-1];if(existing)S.sessionId=existing.id;else newSession(false)}}
function newSession(rerender=true){const a=agent();if(a.archived){toast('已归档智能体不能新建会话',true);return}if(S.run?.agentId===a.id){toast('请等待当前任务完成，或先停止本次执行',true);return}const s={id:uid('ses'),title:'新会话',version:a.version,model:a.model,messages:[],events:[],status:'idle',updated:now()};a.sessions.push(s);S.sessionId=s.id;save();if(rerender){S.tab='debug';render()}}
function currentSession(){return agent()?.sessions.find(s=>s.id===S.sessionId)}
function openSession(id){S.sessionId=id;S.tab='debug';S.editor=null;render()}
function debugHTML(a){let s=currentSession();if(!s){ensureSession();s=currentSession()}if(!s)return'<div class="empty">归档智能体暂无可查看会话。</div>';const run=S.run&&S.run.agentId===a.id&&S.run.sessionId===s.id;return'<div class="debug-layout"><aside class="session-sidebar">'+button('新建会话','newSession()','wide small','plus',a.archived||!!run)+'<p class="session-caption">全部会话</p>'+[...a.sessions].reverse().map(se=>'<button class="session-item '+(se.id===s.id?'active':'')+'" onclick="openSession(\''+se.id+'\')"><strong>'+E(se.title)+'</strong><span>'+E(se.updated.slice(5))+' · v'+se.version+'</span></button>').join('')+'</aside><section class="chat"><header class="chat-head">'+I('message-square','sm')+E(s.title)+'<span class="push"></span>'+pill('配置 v'+s.version,'blue')+'<span>'+E(s.model||a.model)+'</span>'+button('新建会话','newSession()','small compact-new-session','plus',a.archived||!!run)+'</header><div class="chat-messages" id="chat-messages">'+(s.messages.length?s.messages.map(messageHTML).join(''):'<div class="chat-welcome">'+iconBox(a.template)+'<h3>你好，我是'+E(a.name)+'</h3><p>从一项具体任务开始，验证模型与技能的协作效果。<br>当前使用回复与执行事件。</p><div>'+['帮我整理一份行业研究简报','介绍一下你能做什么'].map(t=>'<button class="suggestion" onclick="fillChat(\''+t+'\')">'+E(t)+' '+I('arrow-up-right','sm')+'</button>').join('')+'</div></div>')+(run?'<div class="chat-message"><span class="message-avatar">'+I('command')+'</span><div class="message-content"><div class="message-label">'+E(a.name)+'</div><div class="pulse-dots">正在'+E(s.events[s.events.length-1]?.title||'准备执行')+'…</div></div></div>':'')+'</div><div class="chat-input-wrap">'+(a.status!=='running'?'<div class="alert '+(a.status==='error'?'red':'blue')+'" style="font-size:10px;margin-bottom:10px;padding:8px 10px">'+I('info')+'当前'+(statusNames[a.status]||a.status)+'，启动并就绪后可发送任务。'+(a.status==='stopped'?'<button class="link-btn" onclick="startAgent(\''+a.id+'\')">启动</button>':'')+'</div>':'')+(s.version!==a.version?'<div class="alert blue" style="font-size:10px;margin-bottom:10px;padding:8px 10px">'+I('info')+'这是旧配置的历史会话，请新建会话验证当前配置。</div>':'')+'<div class="chat-input-box"><textarea id="chat-input" aria-label="任务输入" placeholder="描述你希望智能体完成的任务…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat()}" '+(run||a.archived?'disabled':'')+'></textarea><div class="chat-input-tools"><span>'+I('info','sm')+' 会话</span><span class="push"></span><span>Enter 发送</span>'+(run?button('停止','stopRun()','small','square'):button('','sendChat()','primary send','arrow-up',a.status!=='running'||a.archived||s.version!==a.version))+'</div></div><div class="chat-input-footer">回复与执行为模拟，不会实际调用外部服务</div></div></section><aside class="execution"><h4>'+I('activity','sm')+'执行详情</h4><p class="subtitle">记录工具调用与运行结果。</p>'+(s.events.length?s.events.map(e=>'<div class="exec-item">'+I(e.state==='done'?'check-circle':'loader')+'<div>'+E(e.title)+'<p>'+E(e.desc)+'</p></div></div>').join(''):'<p class="subtitle" style="margin-top:30px">发起任务后，执行事件会显示在这里。</p>')+'<div class="exec-divider"></div><h4>'+I('tool','sm')+'可用技能</h4><div class="chip-row">'+a.skills.map(id=>skill(id)?'<span class="tag-plain" style="font-size:9px">'+E(skill(id).name)+(pending(a).includes(id)?' · 待授权':'')+'</span>':'').join('')+'</div>'+((a.knowledge||a.memory)?'<div class="exec-divider"></div><h4>'+I('database','sm')+'关联资源</h4><p class="subtitle">'+E(DB.knowledge.find(k=>k.id===a.knowledge)?.name||'')+'<br>'+E(DB.memory.find(m=>m.id===a.memory)?.name||'')+'</p>':'')+'</aside></div>'}
function messageHTML(m){return'<div class="chat-message '+(m.role==='user'?'user':'')+'"><span class="message-avatar">'+(m.role==='user'?'Y':I('command'))+'</span><div class="message-content"><div class="message-label">'+(m.role==='user'?'你':'智能体 · 回复')+'</div><div class="body">'+E(m.text)+'</div>'+(m.file?'<div class="file-output">'+I('file-text')+'<div>'+E(m.file)+'<small>Markdown · 示例产出</small></div><button class="close push" aria-label="下载示例文件" onclick="downloadReport()">'+I('download','sm')+'</button></div>':'')+'</div></div>'}
function fillChat(t){if($('chat-input')){$('chat-input').value=t;$('chat-input').focus()}}
function scrollChat(){setTimeout(()=>{let m=$('chat-messages');if(m)m.scrollTop=m.scrollHeight},30)}
function sendChat(){const a=agent(),s=currentSession(),el=$('chat-input');if(!a||!s||!el)return;if(S.run){toast('当前已有任务正在执行',true);return}if(a.status!=='running'||a.archived){toast('请先启动智能体',true);return}if(s.version!==a.version){toast('请新建会话，使用当前生效配置',true);return}const t=el.value.trim();if(!t){el.focus();return}if(s.messages.length===0)s.title=t.slice(0,16);s.messages.push({role:'user',text:t});s.status='running';s.updated=now();s.events=[{title:'准备执行',desc:'读取当前生效配置与关联资源',state:'done'}];const token=uid('run');S.run={token,agentId:a.id,sessionId:s.id};save();renderDetail();const valid=()=>S.run?.token===token;const update=()=>{save();if(S.agentId===a.id&&S.tab==='debug')renderDetail()};setTimeout(()=>{if(!valid())return;s.events.push({title:t.includes('短信')?'检查短信服务授权':t.includes('通话')?'检查通话身份':a.skills.includes('search')?'检索公开资料':'处理任务内容',desc:'工具调用事件',state:'done'});update()},1100);setTimeout(()=>{if(!valid())return;s.events.push({title:'整理执行结果',desc:'生成可检查的任务回复',state:'done'});update()},2300);setTimeout(()=>{if(!valid())return;let text,file;if(/短信|通话/.test(t)){let id=t.includes('短信')?'sms':'phone';if(!a.skills.includes(id))text='当前智能体尚未启用'+(skill(id)?.name||({phone:'智能通话',sms:'短信服务'})[id]||'该技能')+'。\n\n请在「配置 → 技能与工具」中添加该技能，再关联通信身份，应用配置后新建会话验证。\n\n此处仅操作路径，没有实际发起外部通信。';else if(!a.authorized.includes(id))text=(skill(id)?.name||({phone:'智能通话',sms:'短信服务'})[id]||'该技能')+'尚未完成身份关联。请先在配置中授权对应的通信资源。\n\n本次没有执行发送或拨打操作。';else text='已检查'+(skill(id)?.name||({phone:'智能通话',sms:'短信服务'})[id]||'该技能')+'的身份与配置。\n\n当前为，没有实际发送短信或发起通话。正式接入后，此处会展示请求状态、执行结果与可追溯记录。'}else if(/报告|研究|简报|整理/.test(t)){text='已完成本次任务，示例简报已生成。\n\n1. 研究范围\n围绕智能体基础设施，整理托管运行、工具执行与能力关联三个方向。\n\n2. 主要观察\n运行环境负责让智能体持续工作；沙箱承接按需隔离执行；技能、知识与记忆通过配置关联。\n\n3. 建议关注\n先验证创建与调试闭环，再逐步完善授权、版本和外部接入。\n\n以上为预置示例内容，不代表实时检索结论。';file='智能体基础设施研究简报.md'}else text='你好，我是'+a.name+'。\n\n当前使用 '+a.model+'，已配置 '+a.skills.length+' 个技能。你可以让我协助处理资料、整理文档或分析问题。\n\n在这个原型里，可以体验任务输入、执行进度、结果展示、停止任务和会话记录；回复为本地内容。';s.messages.push({role:'assistant',text,file});s.status='done';s.updated=now();S.run=null;event(a,'调试任务完成',s.title);update()},3600)}
function stopRun(){if(!S.run)return;const a=DB.agents.find(a=>a.id===S.run.agentId),s=a?.sessions.find(s=>s.id===S.run.sessionId);S.run=null;if(s){s.status='cancelled';s.messages.push({role:'assistant',text:'本次执行已停止。智能体运行环境保持运行，可以继续发起新的任务。'});s.events.push({title:'用户停止执行',desc:'仅停止本次任务',state:'done'});save()}if(S.tab==='debug')renderDetail();toast('已停止本次执行')}
function sessionsHTML(a){return'<section class="panel"><div class="toolbar"><h3 class="section-title" style="margin:0">会话记录</h3><span class="tiny muted">共 '+a.sessions.length+' 条</span><div class="push"></div>'+button('新建会话',"changeTab('debug');newSession()",'primary small','plus',a.status!=='running'||a.archived)+'</div><div class="table-wrap"><table class="data-table"><thead><tr><th>标题 / ID</th><th>使用配置</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody>'+(a.sessions.length?[...a.sessions].reverse().map(s=>'<tr><td><span class="recent-session-title">'+E(s.title)+'</span><div class="subtext mono">'+E(s.id)+'</div></td><td>'+pill('v'+s.version,'blue')+'</td><td>'+pill(({idle:'空闲',running:'执行中',done:'已完成',cancelled:'已停止'})[s.status]||'空闲',s.status==='done'?'green':'gray')+'</td><td style="color:#9aa4b7">'+E(s.updated)+'</td><td><button class="link-btn" onclick="openSession(\''+s.id+'\')">查看会话</button></td></tr>').join(''):'<tr><td colspan="5"><div class="empty">'+I('message-square')+'<h3>还没有会话记录</h3><p>在在线调试中发起一个任务，会话将保存在这里。</p>'+button('开始调试',"changeTab('debug')",'small primary','play',a.status!=='running')+'</div></td></tr>')+'</tbody></table></div></section>'}
function downloadReport(){const text='# 智能体基础设施研究简报\n\n> 预置示例，非实时研究结果。\n\n## 主要观察\n\n- 智能体与运行环境统一创建和管理。\n- 沙箱为独立的工具执行能力。\n- 技能、知识、记忆与身份按需关联。\n\n## 下一步\n\n验证创建、配置生效、在线调试和运行管理的完整闭环。\n';const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));let l=document.createElement('a');l.href=url;l.download='智能体基础设施研究简报-示例.md';l.click();setTimeout(()=>URL.revokeObjectURL(url),200);toast('示例文件已下载')}
const resourceMeta={sandboxes:{title:'沙箱',desc:'为代码、浏览器和设备操作提供独立执行环境，按需接入智能体。',create:'创建沙箱',icon:'box'},skills:{title:'技能',desc:'管理通用工具、通信、设备操作与 MCP 服务，在智能体配置中按需关联。',create:'添加自定义技能',icon:'tool'},knowledge:{title:'知识库',desc:'集中管理业务资料与文档，关联到智能体作为任务参考。',create:'创建知识库',icon:'book-open'},memory:{title:'记忆库',desc:'保存长期偏好与任务经验，让智能体持续积累可复用的上下文。',create:'创建记忆库',icon:'database'},identity:{title:'身份',desc:'管理智能体身份、关联账号与资源授权，承接通信和设备能力的访问范围。',create:'添加身份',icon:'shield'}};
function renderResource(){const m=resourceMeta[S.page];$('main').innerHTML=head(m.title,m.desc,button(m.create,'newResource()','primary','plus'))+(S.page==='identity'?'<div class="alert blue">'+I('shield')+'<span>身份模块承接账号与授权。智能体中只关联身份和资源，不重复创建一套权限体系。</span></div>':'')+'<div class="resource-tools"><div class="search">'+I('search')+'<input class="input" placeholder="搜索'+m.title+'" aria-label="搜索'+m.title+'" value="'+E(S.resourceQuery)+'" oninput="S.resourceQuery=this.value;renderResourceCards()"></div>'+(S.page==='skills'?'<div class="subtabs" style="margin:0">'+['全部','通用','通信','开发工具','设备操作','MCP 服务'].map(c=>'<button class="subtab '+(S.resourceCategory===c?'active':'')+'" onclick="S.resourceCategory=\''+c+'\';renderResource()">'+c+'</button>').join('')+'</div>':'')+'<span class="push tiny muted">本地资源</span></div><div id="resource-cards" class="resource-grid"></div><div class="note-line">'+I('info','sm')+(S.page==='sandboxes'?'沙箱独立于智能体运行环境，只有完成调用适配后，才可作为工具接入。':S.page==='skills'?'技能目录管理能力来源与说明；具体参数、授权和启用状态在智能体中配置。':S.page==='knowledge'?'知识库可在「智能体 → 配置 → 知识、记忆与身份」中关联。':S.page==='memory'?'记忆库可在智能体配置中关联，示例内容不会用于真实模型调用。':'此处为身份与授权关系，不会连接或授权真实外部账号。')+'</div>';renderResourceCards()}
function resourceList(){return S.page==='identity'?DB.identities:DB[S.page]}
function linkedCount(kind,id){return DB.agents.filter(a=>!a.archived&&(kind==='skills'?a.skills.includes(id):kind==='knowledge'?a.knowledge===id:kind==='memory'?a.memory===id:kind==='identity'?true:false)).length}
function renderResourceCards(){const list=resourceList().filter(x=>(!S.resourceQuery||[x.name,x.desc].join('').toLowerCase().includes(S.resourceQuery.toLowerCase()))&&(S.page!=='skills'||S.resourceCategory==='全部'||x.category===S.resourceCategory));$('resource-cards').innerHTML=list.length?list.map(x=>'<section class="resource-card"><div class="resource-card-top"><span class="small-icon" style="width:34px;height:34px">'+I(x.icon||resourceMeta[S.page].icon)+'</span>'+(S.page==='sandboxes'?status(x):S.page==='skills'?pill(x.category):S.page==='identity'?pill(x.status,x.status==='可用'?'green':'amber'):pill('可用','green'))+'</div><h3>'+E(x.name)+'</h3><p>'+E(x.desc)+'</p><div class="resource-card-bottom"><span>'+(S.page==='skills'?'v'+x.version+' · '+linkedCount(S.page,x.id)+' 个智能体使用':S.page==='sandboxes'?E(x.type)+' · '+E(x.spec):S.page==='knowledge'?x.files+' 个文档 · '+linkedCount(S.page,x.id)+' 个智能体':S.page==='memory'?x.items.length+' 条记忆 · '+linkedCount(S.page,x.id)+' 个智能体':E(x.type))+'</span><button class="link-btn" onclick="resourceDetail(\''+x.id+'\')">'+(S.page==='skills'?'查看技能':'管理')+' '+I('arrow-right','sm')+'</button></div></section>').join(''):'<div class="empty" style="grid-column:1/-1">'+I('search')+'<h3>暂无匹配资源</h3><p>修改关键词或创建新的资源。</p></div>'}
function resourceDetail(id){const p=S.page,x=resourceList().find(x=>x.id===id);if(!x)return;let body='<div style="display:flex;gap:12px;align-items:center;margin-bottom:22px"><span class="agent-icon">'+I(x.icon||resourceMeta[p].icon)+'</span><div><strong style="font-size:14px">'+E(x.name)+'</strong><div class="subtext mono">'+E(x.id)+'</div></div></div><p class="subtitle">'+E(x.desc)+'</p>';if(p==='sandboxes')body+='<dl class="kv-grid" style="margin:25px 0">'+kv('类型',E(x.type))+kv('状态',status(x))+kv('运行规格',E(x.spec))+kv('创建时间',E(x.created))+'</dl><div class="help-block"><h4>接入方式</h4><p>可通过适配后的 MCP、API 或 SDK 作为工具接入。当前原型不提供真实访问地址。</p></div>';if(p==='skills')body+='<dl class="kv-grid" style="margin:25px 0">'+kv('分类',pill(x.category))+kv('版本','v'+x.version)+kv('授权要求',x.auth?'需要关联'+E(x.dependency):'无需额外授权')+kv('使用情况',linkedCount(p,id)+' 个智能体')+'</dl><div class="help-block"><h4>如何使用</h4><p>进入智能体的配置页面，添加此技能并按需关联身份，应用配置后进行在线调试。</p></div>';if(p==='knowledge')body+='<div class="help-block"><h4>文档内容</h4><p>当前收录 '+x.files+' 个示例文档，最近更新于 '+E(x.updated)+'。</p></div>'+(x.fileNames||(x.files?['产品使用说明.pdf','行业观察与研究资料.md','常见问题与业务流程.docx']:[])).map(n=>'<div class="line-item"><span class="small-icon">'+I('file-text')+'</span><div class="item-body"><strong>'+n+'</strong><p>示例文档 · 已就绪</p></div></div>').join('');if(p==='memory')body+='<div class="help-block"><h4>记忆内容</h4><p>在智能体配置中关联后，用于保存长期偏好与任务经验。</p></div>'+x.items.map(t=>'<div class="line-item"><span class="small-icon">'+I('bookmark')+'</span><div class="item-body"><strong style="line-height:1.9">'+E(t)+'</strong><p>手动记录 · 示例内容</p></div></div>').join('')+'<div class="field" style="margin-top:22px"><label>新增一条记忆</label><textarea id="new-memory" class="textarea" style="height:80px" placeholder="输入希望智能体保留的信息"></textarea></div>';if(p==='identity')body+='<dl class="kv-grid" style="margin:25px 0">'+kv('身份类型',E(x.type))+kv('当前状态',pill(x.status,x.status==='可用'?'green':'amber'))+'</dl><h4 style="font-size:12px">权限范围</h4><div class="scope-list">'+x.scopes.map(s=>'<span class="tag-plain">'+E(s)+'</span>').join('')+'</div><div class="alert blue" style="margin-top:25px">'+I('info')+'示例身份不包含真实凭据，通信号码与账号需在正式接入后管理。</div>';let foot='<span>'+ (p==='memory'?'共 '+x.items.length+' 条记忆':'资源')+'</span><div class="actions">'+(p==='memory'?button('保存记忆',"addMemory('"+id+"')",'primary','plus'):p==='identity'&&x.status==='待授权'?button('关联授权',"authorizeIdentity('"+id+"')",'primary','shield'):'')+button('关闭','closeLayer()')+'</div>';drawer(x.name,'查看资源详情与关联能力。',body,foot)}
function addMemory(id){const v=$('new-memory').value.trim();if(!v){$('new-memory').focus();return}const x=DB.memory.find(x=>x.id===id);x.items.push(v);x.updated=now();save();resourceDetail(id);renderResourceCards();toast('记忆已保存')}

function saveResourceForm(){
  const f=resourceForm,{kind,id,context}=f;const name=$('rf-name').value.trim(),desc=$('rf-desc').value.trim();let error='';
  if(!name)error='请输入'+moduleNames[kind]+'名称';else if(resourceArray(kind).some(x=>x.id!==id&&x.name===name))error='名称已存在，请换一个名称';

  if(kind==='sandboxes'){v.type=$('rf-type').value;v.authType=$('rf-auth').value;v.codeEnvs=Array.from(document.querySelectorAll('.rf-env:checked')).map(e=>e.value);v.status=v.status||'running';v.spec=v.spec||'4 vCPU / 8 GiB';v.created=v.created||now();}
  if(kind==='skills'){v.source=$('rf-source').value;v.auth=false;v.version=$('rf-version').value.trim()||'1.0.0';v.icon=v.icon||'tool';v.category=v.source==='通信技能'?'通信':'自定义';const zip=$('rf-zip').files[0];if(v.source==='自定义技能'&&!zip&&!v.packageName)error='请选择 ZIP 格式技能包';if(zip&&!/\.zip$/i.test(zip.name))error='技能包必须是 ZIP 文件';if(zip)v.packageName=zip.name;}
  if(kind==='mcps'){v.source=$('rf-source').value;v.transport=$('rf-transport').value;v.url=$('rf-url').value.trim();v.authType=$('rf-auth').value;v.status='可用';try{if(!['https:','http:'].includes(new URL(v.url).protocol))throw 0;}catch{error='请输入有效的 HTTP 或 HTTPS 服务地址';}}
  if(kind==='knowledge'){
    v.allowedTypes=Array.from(document.querySelectorAll('.rf-filetype:checked')).map(e=>e.value);if(!v.allowedTypes.length)error='请至少选择一种文件类型';
    const allowed={xls:'Excel',xlsx:'Excel',doc:'Word',docx:'Word',pdf:'PDF',png:'PNG',jpg:'JPG',jpeg:'JPG'};
    const files=Array.from($('rf-files').files);if(files.some(x=>!v.allowedTypes.includes(allowed[x.name.split('.').pop().toLowerCase()])))error='添加的文件不符合已选择的文件类型';
    const old=f.data.fileNames||[];const kept=Array.from(document.querySelectorAll('.rf-keepfile:checked')).map(e=>old[Number(e.value)]);v.fileNames=[...new Set([...kept,...files.map(x=>x.name)])];if(v.fileNames.some(n=>!v.allowedTypes.includes(allowed[n.split('.').pop().toLowerCase()])))error='保留的文件与所选类型不一致，请移除文件或勾选对应类型';v.files=v.fileNames.length;
  }

  if(error){$('resource-form-error').textContent=error;return;}

  save();closeLayer();if(context)context==='wizard'?renderWizard():renderDetail();else renderResource();toast(moduleNames[kind]+(id?'配置已保存':context?'已创建并关联':'已创建'));

  return '<section class="sandbox-mcp-section"><h4 class="form-subheading">MCP 接入</h4><p class="sandbox-mcp-desc">将服务地址与凭据配置到外部智能体平台，即可将此沙箱作为 MCP 工具调用。</p><div class="sandbox-mcp-field"><span class="sandbox-mcp-label">服务地址 <small>· Streamable HTTP</small></span><div class="sandbox-mcp-value"><span class="mono">'+E(address)+'</span>'+button('复制地址',"copyText('"+address+"')",'text-btn','copy')+'</div></div><div class="sandbox-mcp-field"><span class="sandbox-mcp-label">接入凭据 <small>· 沿用此沙箱 API Key</small></span><div class="sandbox-mcp-value"><span id="sandbox-mcp-key-'+E(x.id)+'" class="mono" data-visible="false">'+E(masked)+'</span><div class="sandbox-mcp-actions"><button class="mcp-icon-button" aria-label="显示或隐藏密钥" onclick="toggleSandboxMcpKey(\''+E(x.id)+'\')">'+I('eye','sm')+'</button>'+button('复制密钥',"copyText('"+credential+"')",'text-btn','copy')+'</div></div></div><div class="sandbox-mcp-footer">'+button('查看调用示例',"showSandboxMcpExample('"+E(x.id)+"')",'small')+'</div></section>';

resourceDetail=function(id,kind=currentResourceKind(),context=null){
  const x=resourceArray(kind).find(x=>x.id===id);if(!x)return;
  let body='<div class="resource-detail-title"><span class="agent-icon">'+I(kind==='mcps'?'link':resourceMeta[kind]?.icon||'shield')+'</span><div><strong>'+E(x.name)+'</strong><div class="subtext mono">'+E(x.id)+'</div></div></div><p class="subtitle">'+E(x.desc||'暂无描述')+'</p><dl class="kv-grid resource-kv">'+kv('配置摘要',E(resourceSummary(kind,x)),true)+kv('更新时间',E(x.updated||x.created||now()))+kv('使用情况',linkedCount(kind,id)+' 个智能体')+'</dl>';
  if(kind==='sandboxes')body+='<h4 class="form-subheading">运行与访问</h4><dl class="kv-grid">'+kv('状态',status(x))+kv('鉴权方式',E(x.authType))+kv('代码环境',E(x.codeEnvs.join('、')||'未启用'),true)+'</dl>'+sandboxMcpHTML(x);
  if(kind==='skills')body+='<dl class="kv-grid">'+kv('技能来源',E(x.source))+kv('版本',E(x.version))+kv('技能包',E(x.packageName||'平台内置'),true)+'</dl>';
  if(kind==='mcps')body+='<dl class="kv-grid">'+kv('传输方式',E(x.transport))+kv('鉴权方式',E(x.authType))+kv('服务地址','<span class="mono">'+E(x.url)+'</span>',true)+'</dl><div class="alert blue">'+I('info')+'这里只连接配置，不会访问该地址。</div>';
  if(kind==='knowledge')body+='<h4 class="form-subheading">文件列表 <span class="muted tiny">'+x.files+' 个</span></h4>'+(x.fileNames.length?x.fileNames.map(n=>'<div class="line-item"><span class="small-icon">'+I('file-text')+'</span><div class="item-body"><strong>'+E(n)+'</strong><p>文件 · 已记录</p></div></div>').join(''):'<div class="optional-state">暂无文件，编辑配置可以添加。</div>');
  if(kind==='memory')body+='<h4 class="form-subheading">长期记忆提取策略</h4><div class="scope-list">'+(x.strategies||[]).map(id=>'<span class="tag-plain">'+E(memoryStrategies.find(x=>x[0]===id)?.[1]||id)+'</span>').join('')+'</div>'+(x.customStrategies||[]).map(s=>'<div class="help-block"><h4>'+E(s.name)+'</h4><p>'+E(s.prompt)+'</p></div>').join('')+'<h4 class="form-subheading">记忆内容</h4>'+x.items.map((t,i)=>'<div class="line-item"><span class="small-icon">'+I('bookmark')+'</span><div class="item-body"><strong>'+E(t)+'</strong></div>'+button('移除',"deleteMemoryItem('"+id+"',"+i+")",'text-btn danger')+'</div>').join('')+field('新增记忆','<textarea id="new-memory" class="textarea short" aria-label="新增记忆" placeholder="输入希望保留的信息"></textarea>')+button('保存记忆',"addMemory('"+id+"')",'small','plus');
  if(kind==='identity')body+='<div class="alert blue">'+I('shield')+'创建完成后自动分配，身份 ID 不可编辑。</div><h4 class="form-subheading">权限范围</h4><div class="scope-list">'+(x.scopes||[]).map(s=>'<span class="tag-plain">'+E(s)+'</span>').join('')+'</div>';
  const linked=DB.agents.filter(a=>kind==='identity'?a.identityId===id:kind==='skills'?a.skills.includes(id):kind==='mcps'?(a.mcps||[]).includes(id):a[{sandboxes:'sandbox',knowledge:'knowledge',memory:'memory'}[kind]]===id);
  body+='<h4 class="form-subheading">关联智能体</h4>'+(linked.length?linked.map(a=>'<div class="line-item"><div class="item-body"><strong>'+E(a.name)+'</strong><p>'+E(a.id)+'</p></div>'+button('查看',"closeLayer();openAgent('"+a.id+"')",'small')+'</div>').join(''):'<div class="optional-state">暂无关联智能体。</div>');
  drawer(x.name,'查看配置、管理内容和资源关联。',body,'<div class="actions">'+button('删除',"deleteResource('"+kind+"','"+id+"')",'danger','trash-2')+'</div><div class="actions">'+button(kind==='skills'?'编辑信息':'编辑配置',"openResourceForm('"+kind+"','"+id+"',"+(context?"'"+context+"'":'null')+")",'primary','edit-2')+'</div>');
};
addMemory=function(id){const v=$('new-memory').value.trim();if(!v){toast('请输入记忆内容',true);return;}const x=DB.memory.find(x=>x.id===id);x.items.push(v);x.updated=now();save();resourceDetail(id,'memory');if(!S.wizard&&!S.agentId)renderResourceCards();toast('记忆已保存');};
function deleteMemoryItem(id,index){const x=DB.memory.find(x=>x.id===id);confirmModal('移除这条记忆？','只移除此条记忆，记忆库与关联智能体保留。',()=>{x.items.splice(index,1);x.updated=now();save();resourceDetail(id,'memory');},'确认移除');}
function deleteResource(kind,id){
  if(kind==='skills'&&skill(id)?.source!=='自定义技能'){toast('平台技能仅供查看与使用',true);return;}
  const x=resourceArray(kind).find(x=>x.id===id);if(!x)return;const count=linkedCount(kind,id);
  confirmModal('删除「'+x.name+'」？',(kind==='identity'?'身份将被回收，关联智能体保留，可在智能体概览中重新分配。':count?'将解除 '+count+' 个智能体的关联，智能体与会话记录保留。':'该资源将从列表移除。')+' 此操作仅影响本地数据。',()=>{
    DB.recycle=DB.recycle||[];DB.recycle.push({kind,resource:clone(x),deleted:now()});
    const clean=a=>{if(kind==='skills'){a.skills=a.skills.filter(x=>x!==id);a.authorized=(a.authorized||[]).filter(x=>x!==id);}else if(kind==='mcps')a.mcps=(a.mcps||[]).filter(x=>x!==id);else if(kind==='identity'&&a.identityId===id){a.identityId='';a.identityRemoved=true;}else {const key={sandboxes:'sandbox',knowledge:'knowledge',memory:'memory'}[kind];if(key&&a[key]===id)a[key]='';}};
    if(S.run)stopRun();
    DB.agents.forEach(a=>{clean(a);if(a.draft)clean(a.draft);});if(S.wizard)clean(S.wizard.data);if(S.editor)clean(S.editor);
    const list=resourceArray(kind);list.splice(list.findIndex(x=>x.id===id),1);save();closeLayer();render();toast(moduleNames[kind]+'已删除');
  },'确认删除');
}

overviewHTML=function(a){
  let out=originalOverview(a);const identity=DB.identities.find(x=>x.id===a.identityId);
  const extra='<section class="card module-connections"><div class="card-header"><h3 class="section-title">配置与资源关联</h3>'+button('编辑配置',"changeTab('config')",'small','edit-2',a.archived||a.status==='creating')+'</div><dl class="kv-grid">'+kv('运行环境',E(a.environment))+kv('内置工具',(a.tools||[]).length+' 个')+kv('MCP',E((a.mcps||[]).map(id=>DB.mcps.find(x=>x.id===id)?.name).filter(Boolean).join('、')||'未关联'),true)+kv('沙箱',E(DB.sandboxes.find(x=>x.id===a.sandbox)?.name||'未关联'))+kv('智能体身份',identity?'<span class="mono">'+E(identity.id)+'</span>':a.status==='creating'||a.status==='draft'?'<span class="muted">创建完成后自动分配</span>':button('重新分配身份',"reassignIdentity('"+a.id+"')",'small'),true)+'</dl></section>';
  return extra+out;
};
runtimeHTML=function(a){return '<section class="card"><div class="card-header"><h3 class="section-title">运行环境配置</h3>'+pill(a.environment,'blue')+'</div><dl class="kv-grid">'+kv('镜像',E(a.template))+kv('规格',E(a.spec))+kv('关联沙箱',E(DB.sandboxes.find(x=>x.id===a.sandbox)?.name||'未关联'))+kv('环境管理','随智能体统一启停')+'</dl></section>'+originalRuntime(a);};
function reassignIdentity(id){const a=DB.agents.find(a=>a.id===id);if(a.identityId)return;makeIdentity(a);event(a,'重新分配智能体身份','已分配新的平台身份');render();toast('新身份已分配');}
agentMenu=function(ev,id){originalAgentMenu(ev,id);const menu=document.querySelector('#menu-layer .menu');if(menu){const b=document.createElement('button');b.className='menu-item danger';b.innerHTML=I('trash-2')+'删除智能体';b.onclick=()=>{closeMenu();deleteAgent(id);};menu.appendChild(b);menu.style.top=Math.max(12,Math.min(parseFloat(menu.style.top),window.innerHeight-menu.offsetHeight-16))+'px';}};
function deleteAgent(id){
  const a=DB.agents.find(a=>a.id===id);confirmModal('删除「'+a.name+'」？','将移除智能体、专属运行环境、身份与会话记录。关联的技能、MCP、沙箱、知识库和记忆库保留在各自列表。',()=>{
    if(S.run?.agentId===id)S.run=null;DB.recycle=DB.recycle||[];DB.recycle.push({kind:'agents',resource:clone(a),identity:clone(DB.identities.find(x=>x.id===a.identityId)||null),deleted:now()});DB.identities=DB.identities.filter(x=>x.agentId!==id);DB.agents=DB.agents.filter(x=>x.id!==id);S.agentId=null;S.editor=null;S.sessionId=null;S.page='agents';save();render();toast('智能体已删除，关联资源保留');
  },'确认删除');
}
authorizeSkill=function(id,context){const sk=skill(id);modal('关联'+sk.name+'授权','<p>为此技能选择账号与操作范围。智能体自身身份由平台自动分配。</p>'+field('外部账号','<div class="input readonly">'+(id==='mail'?'邮箱账号':id==='phone'||id==='sms'?'通信号码':'云手机设备')+'</div>')+'<div class="alert blue">'+I('info')+'仅关联本地授权，不会访问真实账号。</div>',button('取消','closeLayer()')+button('关联授权',"commitAuth('"+id+"','"+context+"')",'primary'));};
syncIdentity=function(a){const identity=DB.identities.find(x=>x.id===a.identityId);if(identity){identity.scopes=['智能体运行','基础工具',...a.authorized.map(id=>skill(id)?.name).filter(Boolean)];identity.updated=now();}};

// Include newly added model/runtime fields in the list without changing debug sessions.
const previousRenderRows=renderAgentRows;

resetDemo=function(){confirmModal('重置所有数据？','将清除本地创建的智能体、会话与资源，恢复初始数据。',()=>{S.run=null;DB=originalSeed();migrateModules();if(typeof migrateCommunicationSkills==='function')migrateCommunicationSkills();S={page:'agents',agentId:null,tab:'overview',query:'',status:'all',template:'all',archived:false,resourceQuery:'',resourceCategory:'全部',resourceSource:'全部',skillArea:'skills',wizard:null,editor:null,sessionId:null,run:null};save();render();toast('已恢复初始数据');},'确认重置');};
save();render();
</script><script>'use strict';

// Identity registration is automatic. Only the associated profile is editable.
const identityRenderResources=renderResource;
const identityResourceDetail=resourceDetail;
const identityMake=makeIdentity;
const identitySync=syncIdentity;
const identityOverview=overviewHTML;
const identitySendChat=sendChat;
const identityCapabilityScopes={sms:['发送消息','查询发送状态','接收消息','消息接收'],phone:['发起外呼','查询通话记录','号码隐私保护'],mail:['邮件发送','邮件接收','邮件读取']};
const identityCapabilityNames={sms:'消息 Skill',phone:'通话 Skill',mail:'云邮 Skill'};
let identityEditState=null;

function identityHash(id){return [...id].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,0);}
function maskPhone(value){return /^\d{11}$/.test(value)?value.slice(0,3)+'****'+value.slice(-4):value||'未绑定';}
function enrichIdentity(x){
  const h=identityHash(x.agentId||x.id),tail=String(h%100000000).padStart(8,'0');
  x.aic=x.aic||'1.2.156.3088.1.CMIC.A.1.1J.'+h.toString(36).toUpperCase().padStart(6,'0');
  x.ownerName=x.ownerName||'空间管理员';x.ownerPhone=x.ownerPhone||'13800006621';
  if(x.ownerVerified===undefined)x.ownerVerified=true;
  if(x.idaasBound===undefined)x.idaasBound=true;
  if(x.enabled===undefined)x.enabled=true;
  x.numbers=x.numbers||[{id:uid('num'),number:'171'+tail,primary:true}];
  x.grants=x.grants||{};
  for(const id of ['sms','phone','mail'])x.grants[id]=x.grants[id]||{number:x.numbers.find(n=>n.primary)?.number||'',scopes:clone(identityCapabilityScopes[id])};
  return x;
}
DB.identities.forEach(enrichIdentity);
makeIdentity=function(a){return enrichIdentity(identityMake(a));};
syncIdentity=function(a){identitySync(a);const x=DB.identities.find(x=>x.id===a.identityId);if(x)enrichIdentity(x);};
navs.find(n=>n[0]==='identity')[2]='智能体身份';
resourceMeta.identity.title='智能体身份';
resourceMeta.identity.desc='统一管理智能体身份码、主人信息、专属号码与通信授权。';

function selectedIdentity(){return DB.identities.find(x=>x.id===S.identityId)||DB.identities[0];}
function openIdentity(id){S.identityId=id;S.page='identity';S.wizard=null;S.agentId=null;S.editor=null;S.resourceQuery='';render();window.scrollTo(0,0);}
function selectIdentity(id){S.identityId=id;renderIdentityContent();}
renderResource=function(){if(S.page==='identity')renderIdentity();else identityRenderResources();};
resourceDetail=function(id,kind=currentResourceKind(),context=null){if(kind==='identity'){closeLayer();openIdentity(id);}else identityResourceDetail(id,kind,context);};

function renderIdentity(){
  DB.identities.forEach(enrichIdentity);
  $('main').innerHTML=head('智能体身份',resourceMeta.identity.desc,button('刷新状态','refreshIdentityStatus()','','refresh-cw'))+'<section class="identity-stats">'+[['cpu','已注册智能体',DB.identities.length,'blue'],['shield','已完成认证',DB.identities.filter(x=>x.ownerVerified&&x.idaasBound).length,'green'],['phone','专属号码已开通',DB.identities.filter(x=>x.numbers.length).length,'orange']].map(([ic,n,v,c])=>'<div class="identity-stat"><span class="identity-stat-icon '+c+'">'+I(ic)+'</span><div><span>'+n+'</span><strong>'+v+'</strong></div></div>').join('')+'</section><div class="identity-layout"><section class="identity-roster panel"><div class="identity-roster-head"><h3>已注册智能体</h3>'+pill('共 '+DB.identities.length+' 个','blue')+'</div><div class="search identity-search">'+I('search')+'<input class="input" aria-label="搜索智能体身份" placeholder="搜索名称 / AIC / 手机号" value="'+E(S.resourceQuery)+'" oninput="S.resourceQuery=this.value;renderIdentityRoster()"></div><div id="identity-roster-list"></div></section><div id="identity-profile"></div></div><div class="note-line">'+I('info','sm')+'身份、认证、号码和授权均为本地数据；创建智能体成功后自动生成，不接入真实认证或通信服务。</div>';
  renderIdentityContent();
}
function renderIdentityContent(){renderIdentityRoster();const x=selectedIdentity();$('identity-profile').innerHTML=x?identityProfileHTML(x):'<section class="card"><div class="empty">'+I('shield')+'<h3>暂无智能体身份</h3><p>创建智能体后，系统会自动分配身份。</p>'+button('创建智能体','openWizard()','primary','plus')+'</div></section>';}
function renderIdentityRoster(){
  const q=(S.resourceQuery||'').toLowerCase(),selected=selectedIdentity();
  const list=DB.identities.filter(x=>[x.name,x.aic,x.ownerPhone,...x.numbers.map(n=>n.number),DB.agents.find(a=>a.id===x.agentId)?.name].join(' ').toLowerCase().includes(q));
  $('identity-roster-list').innerHTML=list.length?list.map((x,i)=>{const a=DB.agents.find(a=>a.id===x.agentId);return '<button class="identity-roster-item '+(x.id===selected?.id?'active':'')+'" aria-label="查看'+E(a?.name||x.name)+'身份" aria-pressed="'+(x.id===selected?.id)+'" onclick="selectIdentity(\''+x.id+'\')"><span class="identity-agent-icon color-'+i%4+'">'+I('cpu')+'</span><span class="identity-roster-copy"><strong>'+E(a?.name||x.name)+'</strong><small>'+E(x.aic)+'</small></span><span class="identity-roster-status">'+pill(x.ownerVerified?'已认证':'待校验',x.ownerVerified?'green':'amber')+I('chevron-right','sm')+'</span></button>';}).join(''):'<div class="optional-state" style="padding:25px 8px">未找到匹配的智能体。</div>';
}
function identityProfileHTML(x){
  const a=DB.agents.find(a=>a.id===x.agentId),primary=x.numbers.find(n=>n.primary)||x.numbers[0];
  return '<section class="identity-profile panel"><div class="identity-profile-head"><span class="identity-agent-icon large">'+I('cpu')+'</span><div><h2>'+E(a?.name||x.name)+'</h2><small class="identity-alias">'+E(x.name)+'</small><div class="identity-profile-badges">'+pill(x.ownerVerified&&x.idaasBound?'已认证':'待完善',x.ownerVerified&&x.idaasBound?'green':'amber')+pill(x.enabled?'已启用':'已停用',x.enabled?'green':'gray')+'</div></div>'+button('管理身份',"manageIdentity('"+x.id+"')",'push','sliders')+'</div><div class="aic-display"><div><span class="aic-tag">AIC</span><strong>智能体唯一身份码（AIC）</strong><button class="copy-btn" aria-label="了解 AIC" onclick="explainAic()">'+I('help-circle','sm')+'</button></div><div class="aic-value"><span>'+E(x.aic)+'</span><button class="copy-btn" aria-label="复制 AIC" onclick="copyText(\''+x.aic+'\')">'+I('copy','sm')+'</button></div></div><div class="identity-facts">'+identityFact('smartphone','主人实名手机号',maskPhone(x.ownerPhone),x.ownerVerified?'已校验':'待校验','用于绑定智能体主人身份，支持行为追溯。',x.ownerVerified?'green':'amber')+identityFact('link','智能体专属号码',maskPhone(primary?.number),primary?'已开通':'未开通','11 位专属号码，由平台分配。',primary?'green':'gray')+identityFact('shield','IDaaS 绑定',x.idaasBound?'已绑定':'待绑定',x.idaasBound?'已完成':'待处理','身份颁发和绑定状态由平台管理。',x.idaasBound?'green':'amber')+'</div><section class="identity-section"><div class="card-header"><div><h3>绑定的通信号码</h3><p>管理该智能体用于外呼、通话和消息服务的号码。</p></div>'+button('管理号码',"manageIdentityNumbers('"+x.id+"')",'small')+'</div><div class="identity-number-grid">'+x.numbers.map(n=>'<div class="identity-number"><span>'+maskPhone(n.number)+'</span>'+pill(n.primary?'主号码':'附加号码',n.primary?'blue':'gray')+'<button class="btn icon-btn tiny" aria-label="管理绑定号码" onclick="manageIdentityNumbers(\''+x.id+'\')">'+I('more-horizontal','sm')+'</button>'+'</div>').join('')+'</div></section><section class="identity-section"><div class="card-header"><div><h3>通信技能授权</h3><p>配置授权号码和可用操作范围，使用已绑定号码调用服务。</p></div>'+button('管理授权',"manageIdentityGrants('"+x.id+"')",'small')+'</div><div class="identity-grants">'+['sms','phone','mail'].map(id=>{
    const granted=a?.authorized.includes(id),enabled=a?.skills.includes(id),grant=x.grants[id];
    return '<div class="identity-grant"><div class="identity-grant-head"><span class="identity-skill-icon '+id+'">'+I(id==='sms'?'message-square':id==='phone'?'phone':'mail')+'</span><strong>'+identityCapabilityNames[id]+'</strong>'+pill(granted?'已授权':enabled?'待授权':'未授权',granted?'green':enabled?'amber':'gray')+'</div><p class="identity-skill-id mono">SkillID: '+E(id)+'</p><p>授权号码：'+maskPhone(grant.number)+'</p><p>'+(granted?'授权范围：':'可授权范围：')+'</p><div class="identity-scope-chips">'+grant.scopes.map(s=>'<span>'+E(s)+'</span>').join('')+'</div><div class="identity-grant-foot">'+(granted?(enabled?'已加入智能体配置':'已授权，可在智能体配置中添加技能'):enabled?'授权后可调用':'按需授权并添加到智能体配置')+'</div></div>';
  }).join('')+'</div></section><div class="identity-bottom-note">'+I('info','sm')+'创建智能体后，平台默认分配 AIC 与专属号码，并记录主人校验及 IDaaS 绑定状态。</div></section>';
}

  confirmModal('应用新的智能体配置？','模型、角色与技能将按当前配置更新。',()=>{
    const old=cfg(a);a.history=a.history||[];a.history.unshift({version:a.version,time:now(),config:old});

    delete a.error;syncIdentity(a);S.editor={...cfg(a),knowledgeEnabled:Boolean(a.knowledgeEnabled),memoryEnabled:a.memoryEnabled!==false};
    event(a,'应用配置 v'+a.version,'更新模型、角色与关联能力');save();render();toast('配置 v'+a.version+' 已生效');
  },'确认应用');
};

function knowledgeEnabledAgents(){return DB.agents.filter(a=>a.knowledgeEnabled);}

function knowledgeParseStats(x){
  const total=Math.max(0,Number(x.files)||0),saved=x.parseStats||{};
  if(['parsed','parsing','failed'].every(key=>Number.isFinite(Number(saved[key]))))return {parsed:Number(saved.parsed),parsing:Number(saved.parsing),failed:Number(saved.failed)};
  if(x.id==='kb_industry'&&total>=3)return {parsed:total-2,parsing:1,failed:1};
  if(x.id==='kb_product'&&total)return {parsed:total,parsing:0,failed:0};
  if(total===0)return {parsed:0,parsing:0,failed:0};
  return {parsed:Math.max(0,total-1),parsing:1,failed:0};
}

function knowledgeFileSummary(x){
  const counts=knowledgeParseStats(x);
  return '<div class="knowledge-file-summary"><strong>'+x.files+' 个文件</strong><div class="knowledge-parse-stats"><span class="parsed">已解析：'+counts.parsed+'</span><span class="parsing">解析中：'+counts.parsing+'</span><span class="failed">解析失败：'+counts.failed+'</span></div></div>';
}

function knowledgeFileState(x,index){
  const counts=knowledgeParseStats(x);
  if(index<counts.parsed)return {key:'parsed',label:'已解析'};
  if(index<counts.parsed+counts.parsing)return {key:'parsing',label:'解析中'};
  return {key:'failed',label:'解析失败'};
}

function saveKnowledgeInfo(id){
  const x=DB.knowledge.find(item=>item.id===id),name=$('knowledge-edit-name')?.value.trim(),desc=$('knowledge-edit-desc')?.value.trim();if(!x)return;
  let error='';if(!name)error='请输入知识库名称';else if(DB.knowledge.some(item=>item.id!==id&&item.name===name))error='名称已存在，请换一个名称';
  if(error){$('knowledge-edit-error').textContent=error;return;}
  x.name=name;x.desc=desc;x.updated=now();save();renderKnowledgeRows();renderKnowledgeDetail(id);toast('基本信息已保存');

function removeKnowledgeFile(id,index){
  const x=DB.knowledge.find(item=>item.id===id),name=x?.fileNames?.[index];if(!x||name===undefined)return;
  knowledgeDialog('移除“'+name+'”','<p class="knowledge-dialog-copy">只移除此文件，不影响知识库中的其他内容。</p>',button('取消','closeKnowledgeDialog()')+button('确认移除',"confirmKnowledgeFileRemoval('"+id+"',"+index+")",'danger'));
}

function confirmKnowledgeFileRemoval(id,index){
  const x=DB.knowledge.find(item=>item.id===id),name=x?.fileNames?.[index];if(!x||name===undefined)return;
  const state=knowledgeFileState(x,index),stats=knowledgeParseStats(x);x.fileNames.splice(index,1);x.files=x.fileNames.length;stats[state.key]=Math.max(0,stats[state.key]-1);x.parseStats=stats;x.updated=now();save();renderKnowledgeRows();renderKnowledgeDetail(id);toast('文件已移除');
}

function prepareKnowledgeUpload(id,input){
  const x=DB.knowledge.find(item=>item.id===id),files=Array.from(input?.files||[]);if(!x)return;
  let error='';if(files.length!==1)error='请选择 1 个文件';
  const file=files[0],ext=file?.name.split('.').pop().toLowerCase();if(file&&!['xls','xlsx','doc','docx','pdf','png','jpg','jpeg'].includes(ext))error='仅支持 Excel、Word、PDF、PNG、JPG 文件';
  if(file&&(x.fileNames||[]).includes(file.name))error='该文件已存在';
  if(error){if(input)input.value='';toast(error,true);return;}
  x.fileNames=x.fileNames||[];x.fileNames.push(file.name);x.files=x.fileNames.length;const stats=knowledgeParseStats(x);stats.parsing+=1;x.parseStats=stats;x.updated=now();S.listPages.knowledgeFiles=Math.ceil(x.files/simplifiedPageSize);save();renderKnowledgeRows();renderKnowledgeDetail(x.id);toast('文件已上传，正在解析');
}

applySkillPageTab=function(){
  const active=simplifiedSkillTabs.some(([id])=>id===S.skillPageTab)?S.skillPageTab:'communication-section';S.skillPageTab=active;
  simplifiedSkillTabs.forEach(([id])=>{const panel=$(id),tab=$('skill-tab-'+id),selected=id===active;if(panel){panel.hidden=!selected;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','skill-tab-'+id);}if(tab){tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;}});
};

renderSkillSections=function(){
  if(!$('communication-items'))return;
  const communication=DB.skills.filter(x=>x.source==='通信技能'&&skillMatches(x)),market=DB.skills.filter(x=>x.source==='技能市场'&&skillMatches(x));
  $('comm-count').textContent=communication.length;$('market-count').textContent=market.length;
  $('communication-items').innerHTML=communication.length?communication.map(sk=>{const spec=communicationSpecs[sk.id];return '<article class="communication-card"><div class="communication-card-head"><span class="communication-icon '+spec.color+'">'+I(spec.icon)+'</span><div><h3>'+E(sk.name)+'</h3><small>v'+E(sk.version)+' · 平台预置</small></div></div><p class="communication-card-desc">'+E(spec.desc)+'</p><div class="communication-features">'+spec.groups.map(([name,desc])=>'<div><span>'+I('check','sm')+'</span><strong>'+E(name)+'</strong><small>'+E(desc)+'</small></div>').join('')+'</div><div class="communication-card-foot">'+button('查看能力',"resourceDetail('"+sk.id+"','skills')",'small')+'</div></article>';}).join(''):skillEmptyHTML('没有匹配的通信技能');
  renderMarketSkills(market);applySkillPageTab();
};

const simplifiedBaseOpenResourceForm=openResourceForm;
openResourceForm=function(kind,id=null,context=null){if(kind==='skills'||kind==='mcps')return;if(kind==='knowledge'&&id)return renderKnowledgeDetail(id,context);return simplifiedBaseOpenResourceForm(kind,id,context);};

resourceMeta.identity.desc='集中维护身份码和主人实名信息。';

    +'<div class="identity-layout"><section class="identity-roster panel"><div class="identity-roster-head"><h3>已注册智能体</h3>'+pill('共 '+DB.identities.length+' 个','blue')+'</div><div class="search identity-search">'+I('search')+'<input class="input" aria-label="搜索智能体身份" placeholder="搜索名称 / AIC / 手机号" value="'+E(S.resourceQuery)+'" oninput="S.resourceQuery=this.value;resetListPage(\'identities\');renderIdentityRoster()"></div><div id="identity-roster-list"></div></section><div id="identity-profile"></div></div>';

identityProfileHTML=function(x){

// Keep the agent management surface focused on status, configuration and debugging.
S.archived=false;
filteredAgents=function(){
  const q=S.query.toLowerCase();
  return DB.agents.filter(a=>!q||[a.name,a.id].some(v=>v.toLowerCase().includes(q))).sort((a,b)=>b.updated.localeCompare(a.updated));
};

renderAgents=function(){
  S.status='all';S.template='all';
  $('main').innerHTML=head('智能体','创建、配置和管理你的云端智能体。',button('创建智能体','openWizard()','primary','plus'))
    +'<section class="panel"><div class="toolbar"><div class="search">'+I('search')+'<input class="input" aria-label="搜索智能体" placeholder="搜索智能体名称或 ID" value="'+E(S.query)+'" oninput="S.query=this.value;resetListPage(\'agents\');renderAgentRows()"></div><div class="push"></div>'+button('','refreshAgents()','icon-btn','refresh-cw')+'</div>'
    +'<div class="table-wrap"><table class="data-table"><thead><tr><th>名称 / ID</th><th>模板</th><th>运行环境</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="agent-rows"></tbody></table></div><div id="table-foot" class="table-foot"></div></section>';
  renderAgentRows();
};

renderAgentRows=function(){
  const agents=filteredAgents(),page=paginateList(agents,'agents');
  $('agent-rows').innerHTML=agents.length?page.items.map(a=>{const canChat=agentCanChat(a),hint=agentStateGroup(a)==='error'?'智能体异常，暂时无法对话':'智能体准备中，暂时无法对话';return '<tr><td><div class="agent-cell">'+iconBox(a.template)+'<div><button class="agent-name" onclick="openAgent(\''+a.id+'\')">'+E(a.name)+'</button><div class="subtext mono">'+E(a.id)+' <button class="copy-btn" aria-label="复制智能体 ID" onclick="copyText(\''+a.id+'\')">'+I('copy')+'</button></div></div></div></td><td>'+pill(a.template)+'</td><td><span>'+E(a.environment||'x86 · Linux')+'</span></td><td>'+agentStatePill(a)+'</td><td style="color:#96a0b3;font-size:11px">'+E(a.updated)+'</td><td><div class="row-actions"><button class="link-btn" onclick="openAgent(\''+a.id+'\',\'debug\')" '+(canChat?'':'disabled title="'+hint+'"')+'>去对话</button><button class="link-btn" onclick="openAgent(\''+a.id+'\',\'config\')">配置</button></div></td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty">'+I('search')+'<h3>没有找到符合条件的智能体</h3><p>试试其他关键词，或清空搜索重新查看。</p>'+button('清空搜索','clearFilters()','small')+'</div></td></tr>';
  $('table-foot').outerHTML='<div id="table-foot" class="table-foot">'+listPaginationHTML('agents',page.page,page.totalPages,page.total,'个智能体')+'</div>';
};

overviewHTML=function(a){
  const recent=(a.sessions||[]).slice(-3).reverse(),sandbox=DB.sandboxes.find(x=>x.id===a.sandbox);
  return '<div class="grid-overview"><div class="stack"><section class="card"><div class="card-header"><h3 class="section-title">基本信息</h3><button class="link-btn" onclick="changeTab(\'config\')">编辑配置</button></div><dl class="kv-grid">'+kv('智能体名称',E(a.name))+kv('智能体框架',pill(a.template))+kv('当前模型',E(a.model))+kv('配置版本',pill('v'+a.version,'blue'))+kv('描述',E(a.description||'暂无描述'),true)+'</dl></section><section class="card"><div class="card-header"><h3 class="section-title">最近调试</h3><button class="link-btn" onclick="changeTab(\'debug\')" '+(agentCanChat(a)?'':'disabled')+'>进入在线调试</button></div>'+(recent.length?recent.map(session=>'<div class="line-item"><span class="small-icon">'+I('message-square')+'</span><div class="item-body"><strong>'+E(session.title)+'</strong><p>'+E(session.updated)+' · 配置 v'+session.version+'</p></div><button class="link-btn" onclick="openSession(\''+session.id+'\')">继续</button></div>').join(''):'<div class="subtitle" style="padding:8px 0 14px">还没有调试记录，可以从在线调试开始验证智能体。</div>')+'</section></div><div class="stack"><section class="card"><div class="card-header"><h3 class="section-title">'+I('cloud')+'运行概览</h3></div><dl class="kv-grid">'+kv('状态',agentStatePill(a))+kv('运行环境',E(a.environment||'x86 · Linux'))+kv('关联沙箱',E(sandbox?.name||'未关联'))+kv('记忆库',a.memoryEnabled!==false?'已开启':'未开启')+kv('更新时间',E(a.updated))+'</dl></section><section class="card" style="background:#fafbfe"><h3 class="section-title" style="font-size:12px">开始使用</h3><p class="subtitle" style="font-size:11px;margin:0">在在线调试中发起任务，验证模型和运行效果。</p><button class="link-btn" style="margin-top:15px" onclick="changeTab(\'debug\')" '+(agentCanChat(a)?'':'disabled')+'>前往在线调试 '+I('arrow-right','sm')+'</button></section></div></div>';
};

renderDetail=function(){
  const a=agent();if(!a){S.agentId=null;renderAgents();return;}
  if(!['overview','config','debug'].includes(S.tab))S.tab='overview';
  $('main').innerHTML='<button class="back" onclick="backToAgents()">'+I('arrow-left','sm')+'返回智能体列表</button><div class="page-head" style="margin-bottom:24px"><div class="detail-heading">'+iconBox(a.template)+'<div><h1>'+E(a.name)+'</h1><div class="detail-meta"><span class="mono">'+E(a.id)+'</span><button class="copy-btn" aria-label="复制 ID" onclick="copyText(\''+a.id+'\')">'+I('copy')+'</button><span class="sep">|</span><span>'+E(a.template)+'</span>'+agentStatePill(a)+pill('配置 v'+a.version,'blue')+'</div></div></div><div class="actions">'+button('在线调试',"changeTab('debug')",'primary','play',!agentCanChat(a))+button('编辑配置',"changeTab('config')",'','sliders')+'</div></div><div class="tabs" role="tablist" aria-label="智能体管理">'+[['overview','概览'],['config','配置'],['debug','在线调试']].map(([id,label])=>'<button role="tab" aria-selected="'+(S.tab===id)+'" class="tab '+(S.tab===id?'active':'')+'" onclick="changeTab(\''+id+'\')">'+label+'</button>').join('')+'</div><div id="detail-content"></div>';
  const content={overview:overviewHTML,config:configHTML,debug:debugHTML};$('detail-content').innerHTML=content[S.tab](a);if(S.tab==='debug')scrollChat();
};

debugHTML=function(a){
  let session=currentSession();if(!session){ensureSession();session=currentSession();}if(!session)return'<div class="empty">还没有可用会话。</div>';
  const running=S.run&&S.run.agentId===a.id&&S.run.sessionId===session.id,canChat=agentCanChat(a),unavailable=agentStateGroup(a)==='error'?'智能体当前异常，暂时无法对话。':'智能体准备中，暂时无法对话。';
  return (!canChat?'<div class="alert '+(agentStateGroup(a)==='error'?'red':'blue')+'">'+I(agentStateGroup(a)==='error'?'alert-circle':'info')+'<span>'+unavailable+'</span></div>':'')+'<div class="debug-layout"><aside class="session-sidebar">'+button('新建会话','newSession()','wide small','plus',!!running)+'<p class="session-caption">调试会话</p>'+[...(a.sessions||[])].reverse().map(item=>'<button class="session-item '+(item.id===session.id?'active':'')+'" onclick="openSession(\''+item.id+'\')"><strong>'+E(item.title)+'</strong><span>'+E(item.updated.slice(5))+' · v'+item.version+'</span></button>').join('')+'</aside><section class="chat"><header class="chat-head">'+I('message-square','sm')+E(session.title)+'<span class="push"></span>'+pill('配置 v'+session.version,'blue')+'<span>'+E(session.model||a.model)+'</span></header><div class="chat-messages" id="chat-messages">'+(session.messages.length?session.messages.map(messageHTML).join(''):'<div class="chat-welcome">'+iconBox(a.template)+'<h3>你好，我是'+E(a.name)+'</h3><p>从一项具体任务开始，验证模型和运行效果。</p><div>'+['帮我整理一份行业研究简报','介绍一下你能做什么'].map(text=>'<button class="suggestion" onclick="fillChat(\''+text+'\')" '+(canChat?'':'disabled')+'>'+E(text)+' '+I('arrow-up-right','sm')+'</button>').join('')+'</div></div>')+(running?'<div class="chat-message"><span class="message-avatar">'+I('command')+'</span><div class="message-content"><div class="message-label">'+E(a.name)+'</div><div class="pulse-dots">正在'+E(session.events[session.events.length-1]?.title||'准备执行')+'…</div></div></div>':'')+'</div><div class="chat-input-wrap">'+(session.version!==a.version?'<div class="alert blue" style="font-size:10px;margin-bottom:10px;padding:8px 10px">'+I('info')+'这是旧配置的历史会话，请新建会话验证当前配置。</div>':'')+'<div class="chat-input-box"><textarea id="chat-input" aria-label="任务输入" placeholder="描述你希望智能体完成的任务…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat()}" '+(running||!canChat?'disabled':'')+'></textarea><div class="chat-input-tools"><span>Enter 发送</span><span class="push"></span>'+(running?button('停止当前任务','stopRun()','small','square'):button('','sendChat()','primary send','arrow-up',session.version!==a.version||!canChat))+'</div></div></div></section><aside class="execution"><h4>'+I('activity','sm')+'执行详情</h4><p class="subtitle">记录本次任务的执行过程。</p>'+(session.events.length?session.events.map(item=>'<div class="exec-item">'+I(item.state==='done'?'check-circle':'loader')+'<div>'+E(item.title)+'<p>'+E(item.desc)+'</p></div></div>').join(''):'<p class="subtitle" style="margin-top:30px">发起任务后，执行过程会显示在这里。</p>')+'</aside></div>';
};

const simplifiedBaseSendChat=sendChat;
sendChat=function(){
  const a=agent();if(a&&!agentCanChat(a)){toast(agentStateGroup(a)==='error'?'智能体异常，暂时无法对话':'智能体准备中，暂时无法对话',true);return;}
  simplifiedBaseSendChat();
};

  drawer('使用指南','按模块组织资源，再到智能体中完成会话调试。',navs.map(([id,icon,label])=>'<div class="help-block"><h4>'+I(icon,'sm')+' '+label+'</h4><p>'+descriptions[id]+'</p></div>').join(''),button('知道了','closeLayer()','primary'));

  confirmModal('重置所有数据？','将清除本地创建的智能体、会话与资源，恢复初始数据。',()=>{
